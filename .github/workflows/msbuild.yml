name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore Textify.sln

    - name: Build
      shell: pwsh
      run: |
        msbuild /m /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=$env:BUILD_PLATFORM Textify.sln /v:n > build.log 2>&1
        $code = $LASTEXITCODE
        if ($code -ne 0) { exit $code }

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: TextifyOCR-x64
        path: x64\Release\TextifyOCR.exe

    - name: Dump build log on failure
      if: failure()
      shell: pwsh
      run: |
        $dir = "ci-debug"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        if (Test-Path build.log) {
          Copy-Item build.log "$dir/build.log" -Force
        } else {
          "build.log not found" | Out-File "$dir/build.log"
        }
        "=== packages dir ===" | Out-File "$dir/build.log" -Append
        if (Test-Path packages) {
          Get-ChildItem packages -Recurse -Name | Out-File "$dir/build.log" -Append
        } else {
          "packages dir MISSING" | Out-File "$dir/build.log" -Append
        }
        "=== workspace files ===" | Out-File "$dir/build.log" -Append
        Get-ChildItem -Name | Out-File "$dir/build.log" -Append
        git config user.name "ci-debug-bot"
        git config user.email "ci-debug-bot@users.noreply.github.com"
        git checkout -B main 2>&1 | Out-Null
        git add ci-debug/build.log
        git commit -m "CI debug: dump build log [skip ci]"
        $pushOut = git push origin main 2>&1
        Write-Host "push result: $pushOut"
        exit 0
