name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore Textify.sln

    - name: Build
      shell: pwsh
      run: |
        msbuild /m /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=$env:BUILD_PLATFORM Textify.sln /v:n > build.log 2>&1
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          Write-Output "##[error]msbuild exited with code $code"
          $errs = Select-String -Path build.log -Pattern "error|错误|fatal" | Select-Object -First 8
          $i = 0
          foreach ($e in $errs) {
            $msg = $e.Line.Trim()
            if ($msg.Length -gt 500) { $msg = $msg.Substring(0, 500) }
            Write-Output "##[error]ERR$i: $msg"
            $i++
          }
          if ($errs.Count -eq 0) {
            Write-Output "##[error]No error lines found; tail of log:"
            Get-Content build.log -Tail 6 | ForEach-Object { Write-Output "##[error]TAIL: $_" }
          }
          exit $code
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: TextifyOCR-x64
        path: x64\Release\TextifyOCR.exe
